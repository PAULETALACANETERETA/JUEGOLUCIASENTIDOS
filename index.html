<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d4bd2"><title>Lucía · La misión de los sentidos</title><style>
:root{font-family:'Trebuchet MS',system-ui,sans-serif;color:#24304d;background:#f1ecff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 10%,#fff0ac,transparent 30%),radial-gradient(circle at 90% 85%,#ffd5e9,transparent 35%),#eae5ff}.app{max-width:1150px;min-height:100vh;margin:auto;padding:20px;display:flex;flex-direction:column;gap:15px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:clamp(17px,2.4vw,25px);font-weight:900;color:#6141b7}.pill{border:3px solid #fff;border-radius:30px;background:#fff9;padding:10px 16px;font-weight:800;box-shadow:0 5px 0 #cfc3f1}.panel{background:#ffffffed;border:5px solid #fff;border-radius:30px;box-shadow:0 12px 0 #d8cff2,0 20px 45px #5744a51b;padding:clamp(18px,3vw,36px);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}.hero{font-size:clamp(65px,12vw,130px);filter:drop-shadow(0 9px 0 #ded3ff)}h1{font-size:clamp(32px,5vw,57px);line-height:1.12;color:#5136aa;margin:0}h2{font-size:clamp(25px,3.5vw,39px);line-height:1.25;margin:0;color:#352b72}p{font-size:clamp(17px,2.1vw,23px);margin:0;line-height:1.45}.subtitle{max-width:760px}.btn{font:inherit;font-weight:900;font-size:clamp(17px,2vw,23px);border:0;border-radius:20px;padding:15px 24px;cursor:pointer;background:#ffca4c;color:#3e3264;box-shadow:0 6px 0 #db9e22;transition:transform .12s}.btn:hover,.option:hover{transform:translateY(-3px)}.btn:active,.option:active{transform:translateY(3px)}.btn.pink{background:#ff76b5;box-shadow:0 6px 0 #d94b8d;color:white}.btn.purple{background:#7659db;box-shadow:0 6px 0 #4d35a5;color:white}.btn.soft{background:#e6e1fa;box-shadow:0 6px 0 #c4b8e8}.actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.missions{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px;width:100%}.mission{background:#f8f4ff;border:3px solid #e3d8ff;border-radius:22px;padding:19px 12px;cursor:pointer;font:inherit;font-size:19px;font-weight:800;min-height:155px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.mission .emoji{font-size:48px}.mission:hover{background:#fff0bf}.mission small{color:#6c6390}.progress{width:100%;height:17px;background:#e6e1f5;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#73d9bc,#56b7ff);transition:width .25s}.question-meta{font-weight:800;color:#7664ad;font-size:17px}.question-visual{font-size:clamp(65px,9vw,110px);min-height:105px;display:flex;align-items:center;justify-content:center;gap:15px}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;width:100%;max-width:920px}.option{border:4px solid #d7d0fa;border-radius:22px;background:#f9f7ff;min-height:118px;padding:12px;cursor:pointer;font:inherit;font-size:clamp(18px,2.2vw,25px);font-weight:900;color:#352b72;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;transition:transform .12s,background .12s}.option .emoji{font-size:clamp(40px,5vw,65px)}.option.correct{background:#c8f8db;border-color:#43ba78}.option.wrong{background:#ffe1e5;border-color:#f17988}.option:disabled{cursor:default}.feedback{min-height:42px;font-weight:900;font-size:23px}.feedback.good{color:#168650}.feedback.try{color:#bd4d6a}.hint{background:#fff2c9;border-radius:16px;padding:12px 20px;font-size:19px}.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:720px}.match-grid .option{min-height:75px}.option.selected{border-color:#ffae27;background:#fff0b5}.order-list{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.order-list .option{width:180px;min-height:115px}.selected-order{font-size:22px;font-weight:800;min-height:40px}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.hidden{display:none!important}.stars{font-size:42px}.confetti{font-size:65px}.small{font-size:16px;color:#625b82}button:focus-visible{outline:5px solid #ff9f32;outline-offset:3px}@media(max-width:650px){.app{padding:10px}.panel{padding:18px 12px;border-radius:20px}.options{grid-template-columns:1fr 1fr}.option{min-height:95px}.mission{min-height:130px}.match-grid .option{font-size:16px}.footer{justify-content:center}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="app"><header class="top"><div class="brand">🌈 LUCÍA · CEIP VILAMAR</div><div class="pill" id="scorePill">⭐ 0 estrellas</div></header><section class="panel" id="screen" aria-live="polite"></section><footer class="footer"><button class="btn soft" id="homeBtn">🏠 Inicio</button><span class="small">Juego educativo · Función de relación · ACIS 2.º Primaria</span><button class="btn soft" id="soundBtn" aria-pressed="true">🔊 Voz activada</button></footer></main><script>
'use strict';
const lessons=[
{title:'Los cinco sentidos',icon:'👁️',items:[
['choice','¿Con qué sentido vemos los colores?','🌈',[['👁️','Vista'],['👂','Oído'],['👃','Olfato']],0,'Los ojos nos ayudan a ver.'],
['choice','¿Con qué sentido escuchamos música?','🎵',[['👅','Gusto'],['👂','Oído'],['✋','Tacto']],1,'Escuchamos con el oído.'],
['choice','¿Qué sentido usamos para oler una flor?','🌸',[['👃','Olfato'],['👁️','Vista'],['👅','Gusto']],0,'La nariz percibe los olores.'],
['choice','¿Con qué sentido sabemos si el limón es ácido?','🍋',[['✋','Tacto'],['👅','Gusto'],['👂','Oído']],1,'La lengua percibe sabores.'],
['choice','¿Qué sentido usamos para notar algo suave?','🧸',[['👁️','Vista'],['👃','Olfato'],['✋','Tacto']],2,'La piel nos permite tocar.']]},
{title:'Estímulos y respuestas',icon:'🚦',items:[
['choice','El semáforo se pone verde. ¿Qué haces?','🚦',[['🚶','Cruzar con cuidado'],['😴','Dormir'],['🍎','Comer']],0,'Vemos una señal y respondemos.'],
['order','Ordena lo que ocurre cuando suena el timbre.','🔔',[['🔔','Suena el timbre'],['👂','Lo escucho'],['🚶','Voy a la puerta']],null,'Primero percibimos y después respondemos.'],
['choice','Tocas algo muy caliente. ¿Qué haces?','🔥',[['✋','Retiro la mano'],['🛏️','Me tumbo'],['🎶','Canto']],0,'Nuestro cuerpo responde al calor.'],
['tf','Los sentidos nos ayudan a saber qué ocurre alrededor.','🌍',true,null,'Los sentidos reciben información.'],
['choice','Lucía ve una pelota que viene hacia ella. ¿Qué puede hacer?','⚽',[['🙌','Cogerla'],['😴','Dormirse'],['📖','Leer']],0,'Ver la pelota ayuda a reaccionar.']]},
{title:'Cerebro y nervios',icon:'🧠',items:[
['choice','¿Qué órgano dirige muchas acciones de nuestro cuerpo?','🧠',[['🧠','Cerebro'],['🦴','Hueso'],['👃','Nariz']],0,'El cerebro recibe información y coordina respuestas.'],
['choice','¿Qué llevan los nervios por el cuerpo?','⚡',[['💬','Mensajes'],['🍞','Pan'],['💧','Agua']],0,'Los nervios transmiten mensajes.'],
['tf','El cerebro está dentro del pie.','🧠',false,null,'El cráneo protege el cerebro.'],
['choice','Si escuchas tu nombre, ¿qué ayuda a entenderlo?','👂',[['🧠','El cerebro'],['🦶','El pie'],['🦷','Los dientes']],0,'El oído recibe el sonido y el cerebro lo interpreta.'],
['order','Ordena esta respuesta.','🌵',[['✋','Toco algo que pincha'],['⚡','Llega un mensaje nervioso'],['🙌','Aparto la mano']],null,'Los nervios transmiten información y ayudan a responder.']]},
{title:'Huesos y articulaciones',icon:'🦴',items:[
['choice','¿Qué parte es dura y sostiene el cuerpo?','🦴',[['🦴','Huesos'],['👅','Lengua'],['👂','Orejas']],0,'Los huesos forman el esqueleto.'],
['choice','¿Qué protege el cráneo?','💀',[['🧠','El cerebro'],['🦶','El pie'],['✋','La mano']],0,'El cráneo protege el cerebro.'],
['choice','¿Dónde podemos doblar el brazo?','💪',[['💪','Codo'],['👃','Nariz'],['👁️','Ojo']],0,'El codo es una articulación.'],
['tf','Las articulaciones permiten mover partes del cuerpo.','🦵',true,null,'La rodilla y el codo son articulaciones.'],
['choice','¿Qué articulación usamos para doblar la pierna?','🦵',[['🦵','Rodilla'],['👂','Oreja'],['👅','Lengua']],0,'La rodilla permite doblar la pierna.']]},
{title:'Músculos y movimiento',icon:'💪',items:[
['choice','¿Qué nos ayuda a mover los huesos?','🏃',[['💪','Músculos'],['👁️','Ojos'],['👃','Nariz']],0,'Los músculos ayudan a mover el cuerpo.'],
['tf','Los músculos no trabajan cuando saltamos.','🤸',false,null,'Los músculos permiten muchos movimientos.'],
['choice','¿Qué usamos para correr?','🏃',[['🦵','Músculos de las piernas'],['👂','Orejas'],['👅','Lengua']],0,'Las piernas se mueven gracias a sus músculos.'],
['choice','¿Qué partes trabajan juntas para movernos?','🤾',[['🦴','Huesos, músculos y articulaciones'],['🍎','Frutas'],['👃','Nariz']],0,'El aparato locomotor permite el movimiento.'],
['order','Ordena esta situación.','⚽',[['👁️','Veo la pelota'],['🧠','Mi cerebro prepara la respuesta'],['🦵','Muevo la pierna']],null,'Los sentidos, el cerebro y los músculos colaboran.']]},
{title:'Cuidamos el cuerpo',icon:'🪖',items:[
['choice','¿Qué usamos al montar en bicicleta?','🚲',[['🪖','Casco'],['🍬','Caramelo'],['📺','Televisión']],0,'El casco protege la cabeza.'],
['choice','¿Cómo cuidamos nuestros oídos?','👂',[['🔉','Evitando ruidos muy fuertes'],['📢','Gritando al oído'],['🎧','Subiendo al máximo el volumen']],0,'Los sonidos demasiado fuertes pueden dañarlos.'],
['tf','Lavarse las manos ayuda a cuidar el cuerpo.','🧼',true,null,'La higiene es importante.'],
['choice','¿Qué hacemos si nos duelen los ojos?','👁️',[['🧑‍⚕️','Se lo decimos a un adulto'],['🙈','Lo ocultamos'],['📱','Miramos más pantallas']],0,'Es importante pedir ayuda.'],
['choice','¿Qué ayuda a mantener los músculos y huesos sanos?','🌞',[['🏃','Moverse y comer variado'],['🛌','No moverse nunca'],['🍭','Comer solo dulces']],0,'El movimiento, la alimentación y el descanso ayudan.']]},
{title:'Gran repaso final',icon:'🏆',items:[
['choice','Lucía huele una pizza. ¿Qué sentido utiliza?','🍕',[['👃','Olfato'],['👂','Oído'],['✋','Tacto']],0,'El olfato detecta olores.'],
['choice','¿Qué órgano coordina muchas respuestas?','🧠',[['🧠','Cerebro'],['🦵','Rodilla'],['👅','Lengua']],0,'El cerebro coordina respuestas.'],
['tf','Los huesos y los músculos ayudan a movernos.','🏃',true,null,'Trabajan juntos para movernos.'],
['order','Lucía escucha una alarma. Ordena la secuencia.','⏰',[['⏰','Suena la alarma'],['👂','Lucía la escucha'],['🧠','La reconoce y responde']],null,'Un estímulo provoca una respuesta.'],
['choice','¿Cuál es una articulación?','🦵',[['🦵','Rodilla'],['👃','Nariz'],['👅','Lengua']],0,'Las articulaciones unen huesos y permiten movimiento.']]}];
let state={page:'home',lesson:0,index:0,stars:0,done:new Set(),sound:true,locked:false,wrong:0,order:[],matched:[],selection:null};const screen=document.getElementById('screen');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function voice(text){if(!state.sound||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=.9;u.pitch=1;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/google español/i.test(v.name)&&v.lang.toLowerCase().startsWith('es'))||voices.find(v=>v.lang.toLowerCase()==='es-es')||voices.find(v=>v.lang.toLowerCase().startsWith('es'))||null;speechSynthesis.speak(u)}catch(e){}}
if('speechSynthesis'in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}
function render(){document.getElementById('scorePill').textContent='⭐ '+state.stars+' estrellas';if(state.page==='home'){screen.innerHTML=`<div class="hero">👧🏻🌈🧠</div><h1>¡La misión de Lucía!</h1><h2>La función de relación y los sentidos</h2><p class="subtitle">¡Vamos a aprender jugando! Descubre los sentidos, el cerebro, los nervios y cómo se mueve nuestro cuerpo.</p><div class="actions"><button class="btn pink" data-action="menu">🚀 ¡EMPEZAR!</button><button class="btn soft" data-action="voice">🔊 Escuchar</button></div><p class="small">7 misiones · 35 retos · 2.º de Primaria</p>`;return}if(state.page==='menu'){screen.innerHTML=`<h1>Elige una misión</h1><p>¡Puedes jugar en el orden que quieras!</p><div class="missions">${lessons.map((l,i)=>`<button class="mission" data-lesson="${i}"><span class="emoji">${l.icon}</span><span>${i+1}. ${esc(l.title)}</span><small>${state.done.has(i)?'✅ Completada':'5 retos'}</small></button>`).join('')}</div><div class="actions"><button class="btn soft" data-action="home">🏠 Portada</button><button class="btn purple" data-action="all">🎯 Jugar todas</button></div>`;return}if(state.page==='finish'){screen.innerHTML=`<div class="confetti">🎉🏆🎉</div><h1>¡Fantástico, Lucía!</h1><h2>¡Misión completada!</h2><p>Has terminado ${state.done.size} de 7 misiones y conseguido <b>${state.stars} estrellas</b>.</p><p>¡Cada intento te ayuda a aprender!</p><div class="actions"><button class="btn pink" data-action="menu">🗺️ Elegir otra misión</button><button class="btn purple" data-action="reset">🔁 Empezar de nuevo</button></div>`;return}renderQuestion()}
function renderQuestion(){let l=lessons[state.lesson],q=l.items[state.index];let [type,title,visual,opts,answer,explain]=q;let progress=(state.index/5)*100;let html=`<div class="question-meta">MISIÓN ${state.lesson+1} · ${esc(l.title)} · RETO ${state.index+1} DE 5</div><div class="progress"><div style="width:${progress}%"></div></div><div class="question-visual">${visual}</div><h2>${esc(title)}</h2>`;if(type==='choice'){html+=`<div class="options">${opts.map((o,i)=>`<button class="option" data-answer="${i}"><span class="emoji">${o[0]}</span>${esc(o[1])}</button>`).join('')}</div>`}else if(type==='tf'){html+=`<div class="options"><button class="option" data-answer="true"><span class="emoji">✅</span>Verdadero</button><button class="option" data-answer="false"><span class="emoji">❌</span>Falso</button></div>`}else if(type==='order'){html+=`<p class="small">Toca los dibujos en el orden correcto.</p><div class="order-list">${[2,0,1].map(i=>`<button class="option" data-order="${i}"><span class="emoji">${opts[i][0]}</span>${esc(opts[i][1])}</button>`).join('')}</div><div class="selected-order" id="selectedOrder">Orden: —</div>`}html+=`<div class="feedback" id="feedback" role="status"></div><div class="actions"><button class="btn soft" data-action="read">🔊 Escuchar</button><button class="btn soft" data-action="hint">💡 Pista</button><button class="btn purple hidden" id="nextBtn" data-action="next">Continuar ➜</button></div>`;screen.innerHTML=html;voice(title)}
function feedback(ok,explain){const el=document.getElementById('feedback');el.className='feedback '+(ok?'good':'try');el.textContent=ok?'🌟 ¡Muy bien! '+explain:'💗 Prueba otra vez. ¡Tú puedes!';voice(el.textContent);if(ok){state.locked=true;state.stars++;document.getElementById('scorePill').textContent='⭐ '+state.stars+' estrellas';screen.querySelectorAll('[data-answer],[data-order]').forEach(b=>b.disabled=true);document.getElementById('nextBtn').classList.remove('hidden')}else{state.wrong++}}
function answer(v,button){if(state.locked)return;let q=lessons[state.lesson].items[state.index];let ok=q[0]==='tf'?(v==='true')===q[3]:Number(v)===q[4];if(ok){button.classList.add('correct');feedback(true,q[5])}else{button.classList.add('wrong');setTimeout(()=>{if(!state.locked)button.classList.remove('wrong')},700);feedback(false,q[5])}}
function order(i,button){if(state.locked||state.order.includes(i))return;state.order.push(i);button.classList.add('selected');document.getElementById('selectedOrder').textContent='Orden: '+state.order.map((n,j)=>(j+1)+'. '+lessons[state.lesson].items[state.index][3][n][1]).join(' → ');if(state.order.length===3){const q=lessons[state.lesson].items[state.index];if(state.order.every((n,j)=>n===j)){feedback(true,q[5])}else{state.order=[];setTimeout(()=>{if(!state.locked){screen.querySelectorAll('[data-order]').forEach(b=>b.classList.remove('selected'));document.getElementById('selectedOrder').textContent='Orden: —'}},1100);feedback(false,q[5])}}}
function next(){state.locked=false;state.order=[];if(state.index<4){state.index++;render()}else{state.done.add(state.lesson);state.page='finish';render();voice('¡Fantástico, Lucía! Has completado la misión.')}}
function startLesson(i){state.lesson=i;state.index=0;state.page='question';state.locked=false;state.order=[];render()}
screen.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.lesson!==undefined){startLesson(Number(b.dataset.lesson));return}if(b.dataset.answer!==undefined){answer(b.dataset.answer,b);return}if(b.dataset.order!==undefined){order(Number(b.dataset.order),b);return}switch(b.dataset.action){case'menu':state.page='menu';render();break;case'home':state.page='home';render();break;case'all':startLesson(0);break;case'next':if(state.index===4&&state.lesson<6&&state.done.size===state.lesson){state.done.add(state.lesson);startLesson(state.lesson+1)}else next();break;case'read':{let q=lessons[state.lesson].items[state.index];voice(q[1]);break}case'hint':{let q=lessons[state.lesson].items[state.index];const hint=q[5];document.getElementById('feedback').innerHTML=`<span class="hint">💡 ${esc(hint)}</span>`;voice(hint);break}case'voice':voice('¡Hola, Lucía! Vamos a jugar y aprender.');break;case'reset':state.stars=0;state.done=new Set();state.page='menu';render();break;}});
document.getElementById('homeBtn').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();state.page='home';render()};document.getElementById('soundBtn').onclick=()=>{state.sound=!state.sound;document.getElementById('soundBtn').textContent=state.sound?'🔊 Voz activada':'🔇 Voz desactivada';document.getElementById('soundBtn').setAttribute('aria-pressed',String(state.sound));if(!state.sound&&'speechSynthesis'in window)speechSynthesis.cancel();else voice('Voz activada')};render();
</script></body></html>
